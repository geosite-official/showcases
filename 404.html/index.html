<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Перенаправление на витрину...</title>
    <script>
        // Автоматическое перенаправление, если мессенджер склеил слово с ссылкой (например /Сайт)
        var path = window.location.pathname;
        var cleanPath = path.replace(/[\/%D0%A1%D0%B0%D0%B9%D1%82\s]+$/, '');
        
        if (path.indexOf('bannaya-usadba-tsarskiy-par-tver') !== -1) {
            window.location.replace('/showcases/bannaya-usadba-tsarskiy-par-tver/');
        } else if (path.indexOf('russkaya-banya-na-drovah-medvezhiy-ugol') !== -1) {
            window.location.replace('/showcases/russkaya-banya-na-drovah-medvezhiy-ugol/');
        } else if (path.indexOf('spa-bannyy-chan-tayozhnyy-relaks') !== -1) {
            window.location.replace('/showcases/spa-bannyy-chan-tayozhnyy-relaks/');
        } else {
            window.location.replace('/showcases/');
        }
    </script>
</head>
<body style="background:#0F1914; color:#fff; font-family:sans-serif; text-align:center; padding-top:20vh;">
    <h2>Перенаправление на витрину бани...</h2>
    <p><a href="/showcases/bannaya-usadba-tsarskiy-par-tver/" style="color:#ACEF75;">Нажмите здесь, если переход не произошёл автоматически</a></p>
</body>
</html>
